<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/x-icon" href="crayon/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Betania+Patmos+GDL&family=Homemade+Apple&display=swap" rel="stylesheet">
</head>
<body id="site">
    <div id="startform">
        <form id="teacher_setup">
            <fieldset>
                <legend>Honorific</legend>
                <input type="radio" id="mr" name="honorific" value="Mr." required>
                <label for="mr">Mr.</label><br>
                <input type="radio" id="ms" name="honorific" value="Ms." required>
                <label for="ms">Ms.</label><br>
                <input type="radio" id="mrs" name="honorific" value="Mrs." required>
                <label for="mrs">Mrs.</label><br>
                <input type="radio" id="miss" name="honorific" value="Miss." required>
                <label for="miss">Miss.</label><br>
            </fieldset>
            <br>
            <label for="teacher_name">Teacher's Name</label>
            <input type="text" id="teacher_name" name="teacher_name" required><br>
            <br>
            <fieldset>
                <legend>Is anyone celebrating a birthday today?</legend>
                <input type="radio" id="birthdayYes" name="birthday" value="yes" required>
                <label for="birthdayYes">Yes</label><br>
                <input type="radio" id="birthdayNo" name="birthday" value="no" required checked>
                <label for="birthdayNo">No</label><br>
            </fieldset>
            <br>
            <div id="birthdayStudentField" class="hidden">
                <label for="birthdayStudent">Birthday Student:</label>
                <input type="text" id="birthdayStudent" name="birthdayStudent"><br>
            </div>
            <br>
            <label for="background-color-personalization">Background Color</label>
            <input type="text" id="background-color-personalization" name="background-color-personalization" value="lavender"><br>
            <br>
            <label for="horizontal-rule-personalization">Horizontal Rule Color</label>
            <input type="text" id="horizontal-rule-personalization" name="horizontal-rule-personalization" value="plum"><br>
            <br>
            <p>For available color options, <a href="https://htmlcolorcodes.com/color-names/">see this page</a>. If you know what you're doing, you can also use hex color codes.</p>
            <button id="submit" type="submit">Submit</button>
            <button type="button" id="resetBtn">Reset Saved Data</button>
        </form>
    </div>
    <button id="config">Edit Personalizations</button>
    <h1 id="classroom" class="fun-font">{Honorific} {Teacher}'s Class</h1>
    <hr />
    <div id="birthday" class="hidden">
        <h1 id="happybirthday" class="birthday-font">Happy Birthday!</h1>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/II3bhXfarqo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <hr />
    </div>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dduOP1D4Vxg?si=L1UIcOzrAffqTZ_y" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/36IBDpTRVNE?si=oR06jAq7ZHktB5Ga" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/bGetqbqDVaA?si=2ro4kqwDe1jfZL-c" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OEbRDtCAFdU?si=i3YV7uXCYi_ND2WJ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/SLZcWGQQsmg?si=AAHp4RWb14UhqGiM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <script src="app.js" type="text/javascript"></script>
</body>
